<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Showroom Vehicle Explorer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container py-4">
        <h1 class="mb-4">Showroom Vehicle Explorer</h1>

        <section class="card p-3 mb-4">
            <h2 class="h5 mb-3">Search and Filter</h2>
            <form id="filters" class="row g-3">
                <div class="col-md-4">
                    <label for="search" class="form-label">Search by Brand or Model</label>
                    <input type="text" id="search" class="form-control" placeholder="Search vehicles">
                </div>
                <div class="col-md-2">
                    <label for="brand" class="form-label">Brand</label>
                    <select id="brand" class="form-select">
                        <option value="">All brands</option>
                        <option value="Chery">Chery</option>
                        <option value="OMODA">OMODA</option>
                        <option value="JAECOO">JAECOO</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="status" class="form-label">Availability</label>
                    <select id="status" class="form-select">
                        <option value="">All statuses</option>
                        <option value="Available">Available</option>
                        <option value="Reserved">Reserved</option>
                        <option value="Sold">Sold</option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label for="minPrice" class="form-label">Minimum Price</label>
                    <input type="number" id="minPrice" class="form-control" min="0" placeholder="NIS">
                </div>
                <div class="col-md-2">
                    <label for="maxPrice" class="form-label">Maximum Price</label>
                    <input type="number" id="maxPrice" class="form-control" min="0" placeholder="NIS">
                </div>
                <div class="col-12">
                    <button type="button" id="resetFilters" class="btn btn-secondary">Reset Filters</button>
                </div>
            </form>
        </section>

        <div id="loading" class="text-center my-4 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Loading vehicles...</p>
        </div>
        <div id="error" class="alert alert-danger d-none" role="alert"></div>

        <div class="row g-4">
            <section class="col-lg-8">
                <h2 class="h4 mb-3">Vehicle Listing</h2>
                <div id="vehicle-list" class="row g-3"></div>
            </section>
            <section class="col-lg-4">
                <h2 class="h4 mb-3">Vehicle Details</h2>
                <div id="vehicle-details" class="card p-3">
                    <p class="mb-0">Select a vehicle to view its details.</p>
                </div>
            </section>
        </div>
    </main>
    <script type="module" src="js/main.js"></script>
</body>

</html>
